# Validation of everything under infra/, before anything is applied.
#
# There is deliberately no `tofu plan` here, and it is not an oversight.
# These runners sit on the public internet; the Proxmox API sits on a private
# LAN behind the OPNsense with no port forward. No credential fixes a missing
# route, so a plan would need a self-hosted runner inside the network, which
# is a separate decision with its own cost. What is left still catches the
# mechanical errors, because fmt, validate and the linters are all offline.
#
# This does not replace code-review / security-review before a real apply.
# The difference from CI over application code is the cost of a mistake: a
# malformed change does not fail a test, it destroys a VM.

name: infra validate

on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/infra-validate.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-validate.yml"

permissions:
  contents: read

jobs:
  opentofu:
    name: OpenTofu (fmt, init, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      # Formatting first: it is the cheapest check and the one most likely to
      # fire, and a diff-noisy repo hides the changes that matter.
      - name: tofu fmt
        run: tofu -chdir=infra/opentofu fmt -check -recursive

      # -backend=false because there is no remote backend and no credentials
      # here. It still downloads the provider, which is what validate needs in
      # order to check resource and attribute names against the real schema.
      - name: tofu init
        run: tofu -chdir=infra/opentofu init -backend=false

      - name: tofu validate
        run: tofu -chdir=infra/opentofu validate

  lint:
    name: Ansible and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Both steps below are guarded rather than assumed. The folders were
      # scaffolded empty, and a linter pointed at nothing either fails for the
      # wrong reason or passes without looking, and a job that passes without
      # looking is worse than no job at all. Both now have content to check.
      - name: ansible-lint
        run: |
          if [ -z "$(find infra/ansible -name '*.yml' -o -name '*.yaml' 2>/dev/null)" ]; then
            echo "No playbooks or roles under infra/ansible yet. Nothing to lint."
            exit 0
          fi
          pipx install ansible-lint
          ansible-lint infra/ansible

      - name: kubeconform
        run: |
          if [ -z "$(find infra/kubernetes -name '*.yml' -o -name '*.yaml' 2>/dev/null)" ]; then
            echo "No manifests under infra/kubernetes yet. Nothing to check."
            exit 0
          fi
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          # Schemas of the exact version the cluster runs, not "master": a field
          # that only exists in a newer Kubernetes must fail here, not on apply.
          # Kustomization files are kustomize's own input, not API objects, and
          # have no schema to check against. Helm values files are not API
          # objects either; what they produce is checked in the helm job below.
          ./kubeconform -summary -strict -kubernetes-version 1.36.4 -skip Kustomization \
            -ignore-filename-pattern 'values\.yaml$' infra/kubernetes

  helm:
    name: Helm charts (render and validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      # Fetched from the chart's GitHub release and checked against the digest
      # it was reviewed with, so a changed file fails here instead of being
      # rendered as if it were the same chart.
      - name: fetch kube-prometheus-stack 91.4.1
        run: |
          curl -fsSL --retry 3 -o kps.tgz \
            https://github.com/prometheus-community/helm-charts/releases/download/kube-prometheus-stack-91.4.1/kube-prometheus-stack-91.4.1.tgz
          echo "1bd5e7a88e758ed3ec22db0fe6e72b1352f3f0e7e5a93c79979f7edf361becdb  kps.tgz" | sha256sum -c -

      # Rendered with the repository's values for the cluster's exact version,
      # then checked like the manifests: built-in kinds against the 1.36.4
      # schemas, the operator's own kinds against the community CRD catalog.
      # Types and patterns are enforced; values that the Kubernetes schemas
      # only list in a description, such as an Ingress pathType, are not.
      - name: render and validate monitoring
        run: |
          helm template kps ./kps.tgz --namespace monitoring --kube-version 1.36.4 \
            -f infra/kubernetes/monitoring/values.yaml > monitoring.yaml
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          ./kubeconform -summary -strict -kubernetes-version 1.36.4 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            monitoring.yaml
