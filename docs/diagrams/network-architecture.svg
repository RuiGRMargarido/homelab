<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Homelab network architecture: four zones behind a dedicated OPNsense firewall</title>

  <rect width="960" height="580" fill="#121826"/>

  <!-- connectors (drawn first so cards sit on top) -->
  <g stroke="#4a5568" stroke-width="1.5" fill="none">
    <path d="M480 58 L480 86"/>
    <path d="M480 134 L480 185"/>
    <path d="M135 298 L135 355"/>
    <path d="M480 298 L480 355"/>
    <path d="M825 298 L825 355"/>
  </g>

  <!-- internet -->
  <rect x="402" y="20" width="156" height="38" rx="19" fill="#5f6a7d" stroke="#78849a" stroke-width="1"/>
  <text x="480" y="44" text-anchor="middle" font-size="15" fill="#eef2f8">Internet</text>

  <!-- router -->
  <rect x="350" y="86" width="260" height="48" rx="8" fill="#96a1b3" stroke="#aab4c4" stroke-width="1"/>
  <text x="480" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#151b26">Home router</text>
  <text x="480" y="123" text-anchor="middle" font-size="11" fill="#2f3947">DDNS · port-forward</text>

  <text x="492" y="164" font-size="11" fill="#8792a5">dedicated WAN leg</text>

  <!-- firewall -->
  <rect x="20" y="185" width="920" height="128" rx="10" fill="#1a2334" stroke="#3f5fa8" stroke-width="1.5"/>
  <text x="46" y="214" font-size="14" font-weight="600" fill="#eef2f8">OPNsense firewall VM</text>
  <text x="212" y="214" font-size="11" fill="#8792a5">default-deny between zones</text>

  <g font-size="12.5" fill="#eef2f8" text-anchor="middle">
    <rect x="415" y="220" width="130" height="32" rx="6" fill="#4a68b0"/>
    <text x="480" y="240">WAN</text>
    <rect x="70" y="266" width="130" height="32" rx="6" fill="#4a68b0"/>
    <text x="135" y="286">DMZ</text>
    <rect x="415" y="266" width="130" height="32" rx="6" fill="#4a68b0"/>
    <text x="480" y="286">Trusted</text>
    <rect x="760" y="266" width="130" height="32" rx="6" fill="#4a68b0"/>
    <text x="825" y="286">Mgmt</text>
  </g>

  <!-- DMZ zone -->
  <rect x="20" y="355" width="230" height="150" rx="10" fill="#191f2e" stroke="#c98a2e" stroke-width="1.5"/>
  <text x="135" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#e0a544">DMZ · VLAN 10</text>
  <text x="135" y="402" text-anchor="middle" font-size="11.5" fill="#8792a5">10.10.10.0/24</text>
  <rect x="36" y="418" width="198" height="34" rx="6" fill="#c98a2e"/>
  <text x="135" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2a1b04">WireGuard</text>
  <text x="135" y="472" text-anchor="middle" font-size="10.5" fill="#7d8798">only service reachable</text>
  <text x="135" y="486" text-anchor="middle" font-size="10.5" fill="#7d8798">from the internet</text>

  <!-- Trusted zone -->
  <rect x="266" y="355" width="428" height="150" rx="10" fill="#191f2e" stroke="#3e9678" stroke-width="1.5"/>
  <text x="480" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#4fb894">Trusted · VLAN 20</text>
  <text x="480" y="402" text-anchor="middle" font-size="11.5" fill="#8792a5">10.10.20.0/24</text>
  <g font-size="12.5" font-weight="600" fill="#f2f8f6" text-anchor="middle">
    <rect x="282" y="418" width="194" height="34" rx="6" fill="#3e9678"/>
    <text x="379" y="440">TrueNAS · ZFS</text>
    <rect x="484" y="418" width="194" height="34" rx="6" fill="#3e9678"/>
    <text x="581" y="440">Caddy</text>
    <rect x="282" y="458" width="194" height="34" rx="6" fill="#3e9678"/>
    <text x="379" y="480">Nextcloud</text>
    <rect x="484" y="458" width="194" height="34" rx="6" fill="#3e9678"/>
    <text x="581" y="480">Jellyfin</text>
  </g>

  <!-- Management zone -->
  <rect x="710" y="355" width="230" height="150" rx="10" fill="#191f2e" stroke="#7b63b8" stroke-width="1.5"/>
  <text x="825" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#9d86d4">Management · VLAN 30</text>
  <text x="825" y="402" text-anchor="middle" font-size="11.5" fill="#8792a5">10.10.30.0/24</text>
  <rect x="726" y="418" width="198" height="34" rx="6" fill="#7b63b8"/>
  <text x="825" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f5f2fb">Proxmox VE</text>
  <text x="825" y="472" text-anchor="middle" font-size="10.5" fill="#7d8798">hypervisor · web UI</text>
  <text x="825" y="486" text-anchor="middle" font-size="10.5" fill="#7d8798">and API</text>

  <!-- authenticated tunnel -->
  <g stroke="#c98a2e" stroke-width="1.5" fill="none" stroke-dasharray="6 5">
    <path d="M135 505 L135 532 L825 532 L825 505"/>
    <path d="M480 505 L480 532"/>
  </g>
  <rect x="392" y="522" width="176" height="20" fill="#121826"/>
  <text x="480" y="537" text-anchor="middle" font-size="11" fill="#c98a2e">authenticated tunnel</text>
</svg>
