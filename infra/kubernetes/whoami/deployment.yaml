# traefik/whoami: a tiny HTTP server that answers with the request it received
# and the name of the pod that answered. Two replicas, so repeated requests
# show the Service spreading them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  labels:
    app.kubernetes.io/name: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
    spec:
      # It never talks to the Kubernetes API, so it gets no credential for it.
      automountServiceAccountToken: false
      # The image is built FROM scratch and sets no user, so by default it
      # would run as root. Listening above 1024, it needs nothing root gives.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          # Tag for the reader, digest for the machine: a tag can be moved to
          # another image, a digest cannot. The multi-architecture index of
          # v1.12.0, read from Docker Hub on 17/09/2026.
          image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
          args:
            - --port=8080
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # A memory limit and no CPU limit: memory cannot be taken back from
          # a process once given, CPU can, and a CPU limit only adds throttling.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          # whoami's /health answers 200 until someone POSTs another status to
          # it, which makes the liveness probe demonstrable on purpose.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
