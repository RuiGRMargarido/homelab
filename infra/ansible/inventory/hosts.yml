---
# Guests configured by Ansible. Every connection setting lives here rather than
# in an ansible.cfg on purpose: this repository is read from WSL2 under /mnt/c,
# where files appear world-writable, and Ansible refuses to load an ansible.cfg
# from a world-writable directory. An inventory has no such restriction.
#
# Reaching the Trusted and DMZ addresses from the PC requires the WireGuard
# tunnel to be up. The two on the flat network are reachable without it.
#
# Every guest is reached the same way: SSH to the guest, as `ansible`, with the
# key in WSL2. The containers had no SSH server until `bootstrap-lxc.sh` opened
# that door, once each, from the host.

all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/homelab_ansible
    ansible_python_interpreter: /usr/bin/python3
    # `accept-new` learns a host's key the first time and refuses it if it ever
    # changes afterwards, which is the useful half of strict checking. Without
    # it the first run against a guest fails with "Host key verification
    # failed", since nothing on this side has met the guest before.
    ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new

  children:
    # Created by OpenTofu, from a Debian 13 cloud image.
    k3s:
      hosts:
        k3s-1:
          ansible_host: 10.10.20.11

    # Existing Debian 12 containers, imported into OpenTofu on 18/09/2026 and
    # configured here since 21/09/2026. LXC 107, the *arr stack, is missing on
    # purpose: it is stopped by decision, and an inventory entry for a guest
    # that cannot answer would turn every run red for a reason that is not a
    # fault. It joins the list the day it runs again.
    containers:
      hosts:
        caddy:
          ansible_host: 192.168.1.83
        wireguard:
          ansible_host: 10.10.10.10
        nextcloud:
          ansible_host: 10.10.20.84
        jellyfin:
          ansible_host: 10.10.20.87
        monitor:
          ansible_host: 192.168.1.91

    # The development machine. Created by OpenTofu on 21/09/2026 from a Linux
    # Mint ISO, with the door opened by bootstrap-mint.sh, and configured here.
    # It is deliberately off when nobody is using it, so a run that cannot
    # reach it usually means it is switched off rather than broken: start it
    # first, and use --limit for everything else in the meantime.
    dev:
      hosts:
        mnt-mate:
          ansible_host: 10.10.20.12
