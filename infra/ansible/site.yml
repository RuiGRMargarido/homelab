---
# Run from WSL2, with the WireGuard tunnel up:
#   cd /mnt/c/Users/ruigr/Documents/GitHub/homelab/infra/ansible
#   ansible-galaxy collection install -r requirements.yml   (once)
#   ansible-playbook -i inventory site.yml
#
# A second run must report changed=0. That is the test that this describes a
# state rather than a sequence of commands that happened to work once.
#
# The containers are taken one at a time, with `--limit`, until each has been
# through a first run: that first run installs the sixty-odd packages each of
# them is behind, and may restart what is running inside.

- name: Configure the k3s node
  hosts: k3s
  become: true
  roles:
    - base
    - k3s_server

- name: Configure the containers
  hosts: containers
  become: true
  roles:
    - base

# Deliberately off when nobody is using it, so this play is the one that is
# normally skipped: `ansible-playbook ... --limit mnt-mate` after starting it,
# rather than a full run that fails on a machine that is merely asleep.
- name: Configure the development machine
  hosts: dev
  become: true
  roles:
    - base
    - workstation
