---
# The kubeconfig is read into memory and rebuilt field by field, instead of
# fetched and then edited. Two reasons. Fetch-then-edit would differ from the
# node's copy on every run and report a change forever, failing the rule that a
# second run changes nothing. And rebuilding the structure, rather than doing
# text replacement on it, makes explicit what leaves the node: the address, the
# names, and the three certificate fields k3s generates. A text replacement was
# tried first and silently failed to rename anything, caught only by testing
# it against a fake kubeconfig. no_log keeps the admin credential out of the
# output, including at higher verbosity.
- name: Read the cluster kubeconfig
  ansible.builtin.slurp:
    src: "{{ k3s_server_kubeconfig_remote }}"
  register: k3s_server_kubeconfig
  no_log: true

- name: Rebuild the kubeconfig pointed at the node, with its own names
  ansible.builtin.set_fact:
    k3s_server_kubeconfig_out:
      apiVersion: v1
      kind: Config
      preferences: {}
      clusters:
        - name: "{{ k3s_server_context_name }}"
          cluster:
            server: "https://{{ ansible_host }}:6443"
            certificate-authority-data: "{{ k3s_server_kubeconfig_in.clusters[0].cluster['certificate-authority-data'] }}"
      contexts:
        - name: "{{ k3s_server_context_name }}"
          context:
            cluster: "{{ k3s_server_context_name }}"
            user: "{{ k3s_server_context_name }}"
      current-context: "{{ k3s_server_context_name }}"
      users:
        - name: "{{ k3s_server_context_name }}"
          user:
            client-certificate-data: "{{ k3s_server_kubeconfig_in.users[0].user['client-certificate-data'] }}"
            client-key-data: "{{ k3s_server_kubeconfig_in.users[0].user['client-key-data'] }}"
  vars:
    k3s_server_kubeconfig_in: "{{ k3s_server_kubeconfig.content | b64decode | from_yaml }}"
  no_log: true

- name: Make sure the kubeconfig directory exists on the control machine
  ansible.builtin.file:
    path: "{{ k3s_server_kubeconfig_local | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write the kubeconfig on the control machine
  ansible.builtin.copy:
    content: "{{ k3s_server_kubeconfig_out | to_nice_yaml }}"
    dest: "{{ k3s_server_kubeconfig_local }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
