---
# Keyboard, clock, locale and the welcome screen: four things that on every
# hand-made machine exist only because somebody answered a question once. Here
# they are written down, which is the difference between a machine that can be
# rebuilt and one that has to be remembered.

- name: Set the keyboard layout for the console and for X11
  ansible.builtin.lineinfile:
    path: /etc/default/keyboard
    regexp: '^XKBLAYOUT='
    line: 'XKBLAYOUT="{{ workstation_keymap }}"'
    owner: root
    group: root
    mode: "0644"
  notify: Apply the keyboard configuration

# The pair is deliberate. Changing /etc/hostname on its own leaves the old name
# in /etc/hosts, and from then on every `sudo` starts with a complaint that it
# cannot resolve the host: a cosmetic break that looks like a real one.
- name: Name the machine what everything else calls it
  ansible.builtin.hostname:
    name: "{{ workstation_hostname }}"

- name: Keep /etc/hosts agreeing with the hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ workstation_hostname }}"
    owner: root
    group: root
    mode: "0644"

- name: Set the time zone
  community.general.timezone:
    name: "{{ workstation_timezone }}"

- name: Generate the locale
  community.general.locale_gen:
    name: "{{ workstation_locale }}"
    state: present

# As the person, because these live in their dconf database and not in any file
# under /etc. The module starts a temporary session bus when there is none, which
# is what makes this work over SSH with nobody logged in: a plain `gsettings` in
# the same position writes into a session that does not exist and is lost.
#
# Takes effect when the window manager next starts, which means at the next
# login rather than at the end of this run.
- name: Turn off the compositor and the animations
  become: true
  become_user: "{{ workstation_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ workstation_dconf_settings }}"

- name: Make sure the person has an autostart directory
  ansible.builtin.file:
    path: "/home/{{ workstation_user }}/.config/autostart"
    state: directory
    owner: "{{ workstation_user }}"
    group: "{{ workstation_user }}"
    mode: "0755"

# A new session should open on the desktop, not on a wizard. The system copy in
# /etc/xdg/autostart is left alone: hiding it per user is the supported way and
# survives an upgrade of the package that owns it.
- name: Keep the Mint welcome screen out of new sessions
  ansible.builtin.copy:
    dest: "/home/{{ workstation_user }}/.config/autostart/mintwelcome.desktop"
    content: |
      [Desktop Entry]
      Type=Application
      Name=mintwelcome
      Hidden=true
    owner: "{{ workstation_user }}"
    group: "{{ workstation_user }}"
    mode: "0644"
