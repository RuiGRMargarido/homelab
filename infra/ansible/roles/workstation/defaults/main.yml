---
# Everything this role installs, and the switch for each block. Turning one off
# is a line in inventory/group_vars/dev.yml, not an edit to the tasks.

# The account created by the Mint installer. Required: the role stops with a
# message if it is empty, because a desktop package installed for nobody in
# particular is the kind of success that is discovered months later.
workstation_user: ""

# System settings that would otherwise exist only because somebody clicked them
# in the installer. The keyboard is the same `es` the VM declares for its
# console in infra/opentofu/dev.tf.
workstation_keymap: es

# What the machine calls itself. The Mint installer called it `dev-VM`, while
# Proxmox and the inventory both call it `mnt-mate`: three names for one machine
# is two too many, and the one that loses is the one only the installer knows.
workstation_hostname: mnt-mate
workstation_timezone: Europe/Lisbon
workstation_locale: pt_PT.UTF-8

# The floor: without these the machine is not a working environment. No switch,
# on purpose.
workstation_base_packages:
  - build-essential
  - ca-certificates
  # Both of these are already on a Mint desktop, and they are written down
  # because the role depends on them rather than hopes for them: the keyboard
  # task edits the file the first one owns, and calls the `setupcon` the second
  # one provides.
  - console-setup
  - keyboard-configuration
  - curl
  # The dconf command line, which the module that writes the desktop settings
  # below runs. gsettings alone is glib and is already there; this one is not
  # guaranteed to be.
  - dconf-cli
  # Mint ships Flatpak with Flathub configured, and disables snapd. Obsidian and
  # IntelliJ come that way, so the requirement is stated instead of assumed.
  - flatpak
  - htop
  - jq
  - ncdu
  - openssh-server
  - pipx
  - python3-dev
  - python3-venv
  - ripgrep
  - rsync
  - tmux
  - tree
  - unzip
  - wget

# Desktop settings that would otherwise exist only because somebody clicked them.
#
# The compositor is on, and it was off for a few hours on 22/09/2026. That is
# worth keeping written down, because the argument that turned it off was sound
# and the machine disagreed with it. Off, on the old reasoning: shadows and
# transparency recomputed and resent on every window movement are the worst trade
# available over a network. Back on, because this machine has no graphics
# acceleration and the protocol carrying it is not an old one: without a
# compositor every window uncovered by a drag waits for the application to
# repaint itself, and under software rendering that is exactly what leaves a
# trail behind the window. RustDesk sends video, so the compositor costs it far
# less than the repainting does.
#
# The animations stay off: those are latency with nothing bought back.
#
# The three keys were read from the machine with `gsettings list-keys` before
# being written here, because a key that does not exist makes the task fail and
# a key that exists under another name does nothing at all.
workstation_dconf_settings:
  - key: /org/mate/marco/general/compositing-manager
    value: "true"
  - key: /org/mate/interface/enable-animations
    value: "false"
  - key: /org/mate/interface/gtk-enable-animations
    value: "false"

# One-line `.list` files this role replaces with its own deb822 `.sources`.
#
# Two definitions of the same repository make apt refuse to read any of them, and
# from that moment every task in this role that touches apt fails with an error
# about `Signed-By` that names neither the role nor the file that caused it. The
# Claude Desktop entry is here because its published quick instructions write
# exactly such a file, by hand, with the key in a different directory from the
# one the module uses.
#
# Removed because it breaks apt, not because it is untidy: the stray keyring it
# points at is inert and is left where it is.
workstation_legacy_sources:
  - /etc/apt/sources.list.d/claude-desktop.list

# The blocks. Each one is independent and carries a tag of the same name, so a
# later addition is `--tags docker` and three minutes rather than a full run.
workstation_rustdesk: true
workstation_vscode: true
workstation_intellij: true
workstation_github: true
workstation_nodejs: true
workstation_docker: true
workstation_java: true
workstation_docs: true
workstation_claude_code: true
workstation_claude_desktop: true
workstation_desktop: true

# The Ubuntu codename these third-party repositories want. Mint reports `zena`
# in ${distro_codename} and its packages come from `noble`, so this is read from
# UBUNTU_CODENAME in /etc/os-release on the machine instead of being written
# here as a constant. See tasks/main.yml.
workstation_ubuntu_codename: ""

# Node 22 is the current LTS. The 18 that Ubuntu 24.04 carries is out of
# support, and the agent tooling assumes a current LTS.
workstation_nodejs_major: 22

workstation_java_packages:
  - openjdk-21-jdk
  - maven

# Obsidian and IntelliJ come from Flathub rather than as downloaded files: a
# signed repository with updates of its own, instead of a .deb pinned by hand
# that nobody remembers to replace. Mint ships Flatpak and Flathub already
# configured, and disables snapd, so this is the way in that is already there.
workstation_flatpak_apps_docs:
  - md.obsidian.Obsidian
workstation_flatpak_apps_intellij:
  - com.jetbrains.IntelliJ-IDEA-Community

# Markdown, diagrams and the conversions a document needs to leave here.
# graphviz is not optional: without it PlantUML draws sequence diagrams and
# fails on everything else, which is exactly where a first attempt lands.
workstation_docs_packages:
  - graphviz
  - pandoc
  - plantuml

# RustDesk publishes no apt repository, so the version is written here and the
# file verified against the sha256 that GitHub publishes for the asset itself,
# read from the release API rather than from a page. Updating is these three
# lines: https://api.github.com/repos/rustdesk/rustdesk/releases/latest
#
# The plain x86_64 build and not the `-sciter` one, which is the old interface
# kept for machines that cannot run the current one.
workstation_rustdesk_version: "1.4.9"
workstation_rustdesk_url: "https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-x86_64.deb"
workstation_rustdesk_checksum: "sha256:7244ba47c40e804172044bfbe659467c54ce46554c98e78c8c0406f1d612fda3"

# The launchers that land on the desktop, as the paths where the packages
# themselves keep them: the two from apt under /usr/share/applications, and the
# two Flatpaks under the directory Flatpak exports to the system. A terminal is
# in the list because it is what this machine is opened for half the time.
workstation_desktop_shortcuts:
  - /usr/share/applications/code.desktop
  # Named after the application id and not after the package, which is why it
  # was read from `dpkg -L claude-desktop` instead of guessed a second time.
  - /usr/share/applications/com.anthropic.Claude.desktop
  - /usr/share/applications/mate-terminal.desktop
  - /var/lib/flatpak/exports/share/applications/com.jetbrains.IntelliJ-IDEA-Community.desktop
  - /var/lib/flatpak/exports/share/applications/md.obsidian.Obsidian.desktop

# One per declared reason: the agent, Python, Java, Docker, pull requests,
# Markdown, Mermaid preview because half the diagrams in docs/ are Mermaid, and
# PlantUML for the other half.
workstation_vscode_extensions:
  - anthropic.claude-code
  - ms-python.python
  - vscjava.vscode-java-pack
  - ms-azuretools.vscode-docker
  - github.vscode-pull-request-github
  - yzhang.markdown-all-in-one
  - bierner.markdown-mermaid
  - jebbs.plantuml
