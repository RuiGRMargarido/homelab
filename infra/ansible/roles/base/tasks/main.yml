---
# The baseline every guest configured by Ansible gets.

- name: Update the package cache and upgrade installed packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

# Installed but deliberately not started here. The service is bound to a
# virtio serial device that only exists once the agent is enabled on the VM in
# OpenTofu, and udev starts it by itself when that device appears. Starting it
# now would fail on a dependency, which would read as a broken role.
- name: Install the QEMU guest agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when: base_guest_agent

# The same policy the host was given by hand on 21/09/2026, the day the
# containers turned out to be 55 to 65 packages behind with nothing able to
# reach inside them. The two files decide what is applied and how often; both
# are in this role, so one edit reaches every guest.
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Write which updates may be applied unattended
  ansible.builtin.copy:
    src: apt-52homelab.conf
    dest: /etc/apt/apt.conf.d/52homelab
    owner: root
    group: root
    mode: "0644"

- name: Write how often they are applied
  ansible.builtin.copy:
    src: apt-20auto-upgrades.conf
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# A reboot is only ever about the kernel, which is why the containers are left
# out of this: they run the host's. Debian restarts the daemons it upgrades by
# itself, so there is nothing for a container to wait for.
#
# The check is a comparison rather than the usual `/var/run/reboot-required`.
# That file does not exist on Debian unless `reboot-notifier` is installed,
# and that package depends on a mail agent and a mail server, which is a lot of
# machinery to learn one fact. Until 21/09/2026 this role looked for the file
# anyway, so the task never once fired.
- name: Find the newest kernel installed
  ansible.builtin.shell:
    cmd: set -o pipefail && ls -1 /boot/vmlinuz-* | sed 's|.*/vmlinuz-||' | sort -V | tail -1
    executable: /bin/bash
  register: base_newest_kernel
  changed_when: false
  when: base_reboot_when_required

- name: Reboot when the running kernel is not the newest installed one
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - base_reboot_when_required
    - base_newest_kernel.stdout | default('') | length > 0
    - base_newest_kernel.stdout != ansible_kernel
