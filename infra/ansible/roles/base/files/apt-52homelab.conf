// Managed by Ansible, from infra/ansible/roles/base/files/. The Proxmox host
// has the same file, written by hand on 21/09/2026, because the host is not in
// this inventory and the decision about reaching it was to stay out.
//
// Debian's own updates are applied without anyone watching. Nothing else is:
// on the host that means the Proxmox repository, which brings kernels and
// keeps its window with a person; in these containers it means Docker and
// whatever else was added by hand.
//
// The list is written out instead of left to the package's default, because
// that default is broader than it reads: on Debian 13 it already included the
// whole stable archive, not only security, and it changes between releases.
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename},label=Debian-Security";
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
        "origin=Debian,codename=${distro_codename},label=Debian";
};

// Never a restart without a person deciding it.
Unattended-Upgrade::Automatic-Reboot "false";

// Old kernels are the way back from a bad one, where there are kernels at all.
// Inert inside a container, which uses the host's, and kept here so that every
// guest carries the same file.
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
