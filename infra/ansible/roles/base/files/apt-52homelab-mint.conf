// Managed by Ansible, from infra/ansible/roles/base/files/. The Mint twin of
// apt-52homelab.conf, for the one guest in this inventory that is not Debian.
//
// Why a second file at all: Mint 22.3 is built on Ubuntu 24.04, and on Mint the
// `${distro_codename}` that the Debian file leans on expands to `zena`, the name
// of the Mint release. No archive called `zena` ships security updates, so every
// pattern would match nothing, unattended-upgrades would be installed, and it
// would be protecting exactly nothing. That is worse than not having it, because
// it looks done.
//
// The Ubuntu codename is therefore written out. It becomes wrong the day this
// machine is upgraded to the next Mint, and that is the point: a release upgrade
// should be a deliberate edit here rather than a variable that quietly resolves
// to the wrong archive.
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
        "origin=Ubuntu,archive=noble-security,label=Ubuntu";
        "origin=Ubuntu,archive=noble-updates,label=Ubuntu";
};

// Deliberately absent, for now: the Mint repository itself, which carries the
// desktop and the Mint tools. Its Release file has to be read on the machine
// before a pattern is written for it, the same rule that produced the three
// Debian lines: origins are read from the host, never quoted from memory.
// Until then, Mint updates are applied by a person, like Docker in the
// containers and the Proxmox repository on the host.

// Never a restart without a person deciding it. Here it matters more than
// anywhere else in this inventory: this is the machine with open windows.
Unattended-Upgrade::Automatic-Reboot "false";

// Old kernels are the way back from a bad one.
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
