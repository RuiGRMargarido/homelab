---
# The QEMU guest agent only means something in a VM: it answers the hypervisor
# through a virtio serial device that a container does not have.
base_guest_agent: true

# Whether this guest reboots itself when its running kernel is no longer the
# newest one installed. True for the VMs. False for the containers, which have
# no kernel of their own: they run the host's, so there is nothing there for a
# reboot to pick up, and one of them carries the tunnel this very connection
# runs through.
base_reboot_when_required: true

# Which set of origins unattended-upgrades may apply, as a file name under
# files/. Debian by default: five of the seven guests are Debian containers and
# the k3s node is a Debian VM. The development machine is Mint, whose packages
# come from Ubuntu, and it overrides this in its group_vars.
base_unattended_origins_file: apt-52homelab.conf
